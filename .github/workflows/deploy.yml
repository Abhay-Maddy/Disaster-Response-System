name: Build Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (outputs to repo root)
        working-directory: frontend
        run: npm run build

      # Commit the freshly-built files back to main so GitHub Pages
      # (source: main branch / root) always serves the latest build.
      - name: Commit built files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html login.html register.html admin.html admin-register.html assets/ favicon.svg icons.svg
          git diff --cached --quiet || git commit -m "chore: auto-build frontend [skip ci]"
          git push
